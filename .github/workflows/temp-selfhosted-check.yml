name: TEMP Self-hosted ARM Runner Check
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Report platform
        run: |
          echo "arch=$(uname -m)  host=$(hostname)"
          python -c "import sys,platform; print('python', sys.version.split()[0], platform.machine())"

      - name: Install project requirements (ARM wheel check)
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt

      - name: Verify heavy deps import on ARM
        run: |
          python -c "import pandas,numpy,boto3,openai,pandas_market_calendars as m; print('pandas',pandas.__version__,'numpy',numpy.__version__,'OK on',__import__('platform').machine())"
