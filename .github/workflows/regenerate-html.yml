name: Regenerate HTML Reports

on:
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      days:
        description: '📊 更新最近N天的HTML报告'
        required: false
        type: number
        default: 7
      specific_date:
        description: '📅 或者：指定特定日期 (YYYY-MM-DD)'
        required: false
        type: string
        default: ''

jobs:
  regenerate:
    name: 🔄 Regenerate HTML Reports
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed for pushing to gh-pages

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📂 Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data

      - name: 🔄 Regenerate HTML reports
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python run.py regenerate-html \
            --days ${{ github.event.inputs.days || 7 }} \
            ${{ github.event.inputs.specific_date && format('--specific-date {0}', github.event.inputs.specific_date) || '' }} \
            --restore-from gh-pages-data

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true  # Keep all existing files
          commit_message: '🔄 Regenerate HTML reports (last ${{ github.event.inputs.days }} days)'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          enable_jekyll: false

      - name: ✅ Regeneration summary
        run: |
          echo "=================================================="
          echo "✅ HTML REGENERATION COMPLETE"
          echo "=================================================="
          echo "🔗 Report URL: https://devfchen.github.io/options-anomaly-detector/"
          echo "📊 Days processed: ${{ github.event.inputs.days }}"
          echo "=================================================="
