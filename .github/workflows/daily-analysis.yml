name: Daily Options Analysis

on:
  # Daily scheduled run starting at 6:00 PM Beijing Time
  # Retry hourly until 9:00 PM if data not yet available
  # If already processed, subsequent runs will skip automatically
  schedule:
    - cron: '0 10-13 * * *'  # 18:00-21:00 Beijing Time / 10:00-13:00 UTC

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: '🔄 强制重新生成 - 即使数据已存在也重新下载、分析、发邮件'
        required: false
        type: boolean
        default: false
      days_back:
        description: '📊 生成过去N个交易日的数据（留空则只生成今天）'
        required: false
        type: number
        default: 0

  # Run on push to main for testing
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'main.py'
      - '.github/workflows/**'

jobs:
  # Job 1: 数据下载与分析
  fetch-and-analyze:
    name: 📊 Data Fetching & Analysis
    runs-on: [self-hosted, linux, ARM64]

    outputs:
      analysis-date: ${{ steps.get-date.outputs.date }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for historical analysis

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📅 Get current date
        id: get-date
        run: echo "date=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 📂 Restore historical data
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true

      - name: 🔍 Run daily analysis
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_S3_ACCESS_KEY: ${{ secrets.POLYGON_S3_ACCESS_KEY }}
          POLYGON_S3_SECRET_KEY: ${{ secrets.POLYGON_S3_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWD: ${{ secrets.GMAIL_APP_PASSWD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_OVERWRITE: ${{ github.event.inputs.force_overwrite }}
        run: |
          python run.py daily-analysis \
            --days-back ${{ github.event.inputs.days_back || 0 }} \
            --restore-from gh-pages-data

      - name: 📊 Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results-${{ steps.get-date.outputs.date }}
          path: |
            output/
            !output/.gitkeep
          retention-days: 90


  # Job 2: 网页部署
  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: fetch-and-analyze
    if: success()
    runs-on: [self-hosted, linux, ARM64]

    permissions:
      contents: write  # Needed for pushing to gh-pages

    steps:
      - name: 📥 Download analysis results
        uses: actions/download-artifact@v4
        with:
          name: analysis-results-${{ needs.fetch-and-analyze.outputs.analysis-date }}
          path: output

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true  # Keep historical data files
          commit_message: '📊 Update report - ${{ needs.fetch-and-analyze.outputs.analysis-date }}'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          enable_jekyll: false

      - name: ✅ Deployment summary
        run: |
          echo "=================================================="
          echo "✅ DEPLOYMENT COMPLETE"
          echo "=================================================="
          echo "📅 Analysis Date: ${{ needs.fetch-and-analyze.outputs.analysis-date }}"
          echo "🔗 Report URL: https://devfchen.github.io/options-anomaly-detector/"
          echo "📦 Files deployed: $(ls output | wc -l)"
          echo "=================================================="
